name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: kallio-fe-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, kallio-local-fe]

    env:
      BASH_ENV: ""

    steps:
      - name: Deploy frontend on local machine
        run: |
          bash /home/lazy/kallio/deploy-fe.sh